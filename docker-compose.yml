# Dev database (+ a separate database for integration tests).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ketoan
      POSTGRES_PASSWORD: ketoan
      POSTGRES_DB: ketoan
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
